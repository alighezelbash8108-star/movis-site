<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتاق واچ‌پارتی</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <header>
    <h1 id="roomTitle">🎬 اتاق واچ‌پارتی</h1>
    <p id="status" style="font-size:13px; color:#aaa; margin-top:5px;">در حال اتصال...</p>
  </header>

  <video id="player" controls playsinline preload="auto" style="width:100%; background:#000; min-height:250px;"></video>

  <div style="padding:15px; display:flex; flex-direction:column; gap:10px;">
    <button id="copyLink" style="padding:15px; border-radius:8px; border:none; background:#1DB954; color:#fff; font-size:15px;">
      📋 کپی لینک دعوت
    </button>
    <div id="linkBox" style="background:#1a1a1a; padding:12px; border-radius:8px; font-size:12px; color:#aaa; word-break:break-all; display:none;"></div>
  </div>

  <script src="room.js"></script>
</body>
</html>
